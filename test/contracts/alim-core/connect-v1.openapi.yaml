        task_name:
          type: string
        task_code:
          type: [string, 'null']
        start_date:
          type: [string, 'null']
          format: date
        end_date:
          type: [string, 'null']
          format: date
        is_active:
          type: boolean
        decree_id:
          type: [string, 'null']
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PersonAssignment:
