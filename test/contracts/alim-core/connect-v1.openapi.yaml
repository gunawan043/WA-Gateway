      operationId: getOrganizationPerson
      summary: Detail satu orang
      tags: [Organization]
      x-contract-status: provisional
      x-needs-core-confirmation:
        - K7 `primary_unit` dan `jenis_gtk` boleh null.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Include'
      responses:
        '200':
          description: Satu orang.
          headers:
            X-ALIM-API-Version:
              $ref: '#/components/headers/X-Alim-Api-Version'
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Person'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /organization/people/{id}/assignments:
    get:
      operationId: listPersonAssignments
      summary: Semua penugasan satu orang
      description: |
        Gabungan tiga sumber (penempatan unit, penugasan struktural, tugas tambahan). Bentuk
        seragamnya **belum ditetapkan**; draf ini hanya memaku `source`, `id`, dan `user_id`, dan
        membiarkan sisanya terbuka. Lihat `docs/35c` §10.
      tags: [Organization]
      x-contract-status: provisional
      x-shape: unresolved
      x-needs-core-confirmation:
        - Bentuk seragam tiga sumber belum disepakati.
        - K8 kunci komposit untuk tugas tambahan.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Halaman penugasan.
          headers:
            X-ALIM-API-Version:
              $ref: '#/components/headers/X-Alim-Api-Version'
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/PersonAssignment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /organization/work-unit-assignments:
    get:
      operationId: listWorkUnitAssignments
      summary: Penempatan GTK pada unit kerja
      description: |
        Baris `gtk_work_unit`. Tidak ada status, tanggal berlaku, atau `deleted_at`: baris yang
        hilang berarti penempatan berakhir. `id` baris berubah bila baris dibuat ulang.
      tags: [Organization]
      x-contract-status: provisional
      x-needs-core-confirmation:
        - K5 tidak ada tombstone; penghapusan hanya terlihat lewat rekonsiliasi.
        - Q4 lebih dari satu `is_primary` per orang.
        - Apakah `id` baris stabil bila `(user_id, work_unit_id)` dibuat ulang.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/UpdatedSince'
        - name: user_id
          in: query
          schema:
            type: string
            format: uuid
        - name: work_unit_id
          in: query
          schema:
            type: string
            format: uuid
        - name: is_primary
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Halaman penempatan.
          headers:
            X-ALIM-API-Version:
              $ref: '#/components/headers/X-Alim-Api-Version'
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/WorkUnitAssignment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /organization/structural-assignments:
    get:
      operationId: listStructuralAssignments
      summary: Penugasan struktural
      description: |
        Satu-satunya keluarga assignment Core dengan status, masa berlaku, dan soft delete.
        `work_unit_id` diturunkan dari `school.work_unit_id`, bukan kolom tersimpan.
      tags: [Organization]
      x-contract-status: provisional
      x-needs-core-confirmation:
        - K1 arti `active_on` dan zona waktu `start_date`/`end_date`.
        - K5 arti `status` dan `deleted_at` bila keduanya bertentangan.
        - Q6 `school_id` yang menunjuk sekolah hilang.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/UpdatedSince'
        - $ref: '#/components/parameters/IncludeDeleted'
        - name: user_id
          in: query
          schema:
            type: string
            format: uuid
        - name: position_id
          in: query
          schema:
            type: string
            format: uuid
        - name: school_id
          in: query
          schema:
            type: string
            format: uuid
        - name: work_unit_id
          in: query
          description: Turunan dari `schools.work_unit_id`.
          schema:
            type: string
            format: uuid
        - name: academic_year_id
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive, ended, all]
        - name: active_on
          in: query
          schema:
            type: string
            format: date
      responses:
