openapi: 3.1.0
info:
  title: ALIM Core — Connect Organization API
  version: 1.0.0-draft.1
  summary: Draf kontrak baca-saja yang dibutuhkan ALIM Connect dari ALIM Core.
  description: |
    **DRAF TAHAP 0 — BUKAN KONTRAK FINAL.**

    Dokumen ini adalah usulan Connect atas bentuk respons yang dibutuhkan, disusun dari
    `docs/integration/alim-connect-api-design.md` milik ALIM Core dan dari pemetaan di
    `docs/35a-alim-core-organization-mapping.md`. Setiap operasi membawa
    `x-contract-status: provisional` dan daftar `x-needs-core-confirmation`; tidak ada operasi yang
    boleh dianggap beku sebelum K1–K10 disepakati kedua pihak (lihat `docs/35c`).

    Batas yang mengikat dokumen ini:

    - hanya `GET`; tidak ada operasi tulis, dan tidak ada operasi yang mengubah data Core;
    - hanya data yang tercantum di `docs/35a` §8.3; tidak ada `nik`, `no_kk`, alamat, atau
      `nomor_sk`;
    - tidak ada endpoint otorisasi: permission Core tidak dipakai Connect (D2);
    - path, nama field, dan semantik waktu masih menunggu konfirmasi tim ALIM Core.

    Dokumen ini bukan pengganti kontrak milik Core. Bila keduanya berbeda, kontrak Core yang
    menang, dan dokumen ini diperbarui.
  x-contract-status: provisional
  x-needs-core-confirmation:
    - Ketersediaan seluruh endpoint; per 2026-11-21 belum ada rute `/api/connect/v1` di Core.
    - K1 semantik waktu (`updated_at`, `updated_since`, `snapshot_at`).
    - K2 aturan versi dan kompatibilitas aditif.
    - K3 bentuk pagination dan batas `per_page`.
    - K4 urutan deterministik `changes`.
    - K5 arti delete dan ketersediaan tombstone.
    - K6 jaminan idempotensi pengiriman ulang.
    - K7 nilai `null` yang diizinkan per field.
    - K8 kunci komposit tugas tambahan.
    - K9 skema autentikasi dan allowlist.
    - K10 angka rate limit.
servers:
  - url: /api/connect/v1
    description: |
      Path relatif terhadap host Core. Mock Tahap 0 menyajikan prefix yang sama pada
      `http://127.0.0.1:<port>/api/connect/v1`; tidak ada koneksi ke Core produksi.
security:
  - connectKey: []
tags:
  - name: Organization
    description: Unit, sekolah, jabatan, orang, penempatan, dan penugasan.
  - name: Sync
    description: Snapshot dan feed perubahan.
paths:
  /organization/units:
    get:
      operationId: listOrganizationUnits
      summary: Daftar unit organisasi
      description: |
        Daftar datar unit. Bentuk pohon (`tree=true`) belum dimasukkan ke draf karena bentuk
        `children` belum disepakati; lihat `docs/35c` §10.
      tags: [Organization]
      x-contract-status: provisional
      x-needs-core-confirmation:
        - K1 inklusivitas `updated_since`
        - K7 `parent_id` dan `divisi` boleh null
        - Q1/Q2 kualitas `parent_id` (yatim dan siklus)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/IsActive'
        - $ref: '#/components/parameters/UpdatedSince'
        - $ref: '#/components/parameters/Include'
        - name: parent_id
          in: query
          description: Anak langsung dari unit tertentu.
          schema:
            type: string
            format: uuid
        - name: type
          in: query
          description: Tipe unit.
          schema:
            $ref: '#/components/schemas/UnitType'
        - name: divisi_id
          in: query
          description: Filter divisi Core (bukan `divisions` Connect).
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          description: Cari pada `name` atau `code`, maksimum 100 karakter.
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: Halaman unit.
          headers:
            X-ALIM-API-Version:
              $ref: '#/components/headers/X-Alim-Api-Version'
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Unit'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /organization/units/{id}:
    get:
      operationId: getOrganizationUnit
      summary: Detail satu unit
      tags: [Organization]
      x-contract-status: provisional
      x-needs-core-confirmation:
        - Bentuk `include` default (`parent,divisi,domain,schools`) belum disepakati.
        - K7 `parent` dan `divisi` boleh null.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Include'
        - $ref: '#/components/parameters/IncludeDeleted'
      responses:
        '200':
          description: Satu unit.
          headers:
            X-ALIM-API-Version:
              $ref: '#/components/headers/X-Alim-Api-Version'
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Unit'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /organization/schools:
    get:
      operationId: listOrganizationSchools
      summary: Daftar satuan pendidikan
      tags: [Organization]
      x-contract-status: provisional
      x-needs-core-confirmation:
        - K5 sekolah tidak memiliki `deleted_at`; penghapusan hanya terlihat lewat rekonsiliasi.
        - Nilai `boarding_type` belum diverifikasi.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/IsActive'
        - $ref: '#/components/parameters/UpdatedSince'
        - $ref: '#/components/parameters/Include'
        - name: work_unit_id
          in: query
          description: Sekolah milik unit tertentu.
          schema:
            type: string
            format: uuid
        - name: school_level
          in: query
          schema:
            type: string
        - name: school_gender
          in: query
          schema:
            type: string
        - name: q
          in: query
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: Halaman sekolah.
          headers:
            X-ALIM-API-Version:
              $ref: '#/components/headers/X-Alim-Api-Version'
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/School'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /organization/schools/{id}:
    get:
      operationId: getOrganizationSchool
      summary: Detail satu sekolah
      tags: [Organization]
      x-contract-status: provisional
      x-needs-core-confirmation:
        - K5 arti sekolah yang tidak lagi muncul.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Include'
      responses:
        '200':
          description: Satu sekolah.
          headers:
            X-ALIM-API-Version:
              $ref: '#/components/headers/X-Alim-Api-Version'
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/School'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /organization/positions:
    get:
      operationId: listOrganizationPositions
      summary: Daftar jabatan struktural
      description: |
        Katalog jabatan. Ini bukan penugasan dan bukan identitas orang; lihat `docs/35a` §3.4.
      tags: [Organization]
      x-contract-status: provisional
      x-needs-core-confirmation:
        - K7 `domain` boleh null; `domain_id` posisi belum tersimpan saat seeding (P5).
        - '`hierarchy_level` tidak konsisten dan tidak boleh dipakai sebagai otoritas.'
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/IsActive'
        - $ref: '#/components/parameters/UpdatedSince'
        - $ref: '#/components/parameters/Include'
        - name: domain_id
          in: query
          schema:
            type: string
            format: uuid
        - name: jenis_gtk_id
          in: query
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: Halaman jabatan.
          headers:
            X-ALIM-API-Version:
              $ref: '#/components/headers/X-Alim-Api-Version'
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
