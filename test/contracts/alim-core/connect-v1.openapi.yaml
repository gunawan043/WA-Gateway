                        $ref: '#/components/schemas/Position'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /organization/people:
    get:
      operationId: listOrganizationPeople
      summary: Daftar orang (GTK)
      description: |
        Identitas orang Core. `id` adalah UUID orang Core, bukan `users.id` Connect dan bukan
        `api_keys.id` Connect; lihat `docs/35a` §5.
      tags: [Organization]
      x-contract-status: provisional
      x-needs-core-confirmation:
        - K7 `primary_unit` boleh null.
        - Q7 orang tanpa `gtk_profile`/`gtk_employment`.
        - Apakah `email` boleh dipakai sebagai petunjuk penautan akun (keputusan D3).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/IsActive'
        - $ref: '#/components/parameters/UpdatedSince'
        - name: work_unit_id
          in: query
          schema:
            type: string
            format: uuid
        - name: school_id
          in: query
          schema:
            type: string
            format: uuid
        - name: status_kepegawaian
          in: query
          schema:
            type: string
        - name: q
          in: query
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: Halaman orang.
          headers:
            X-ALIM-API-Version:
              $ref: '#/components/headers/X-Alim-Api-Version'
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Cache-Control:
