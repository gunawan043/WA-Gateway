        user_id:
          type: string
          format: uuid
        unit_id:
          type: [string, 'null']
          format: uuid
        school_id:
          type: [string, 'null']
          format: uuid
        academic_year_id:
          type: [string, 'null']
          format: uuid
        task_type_id:
          type: [string, 'null']
          format: uuid
        task_type:
          anyOf:
            - $ref: '#/components/schemas/TaskTypeRef'
