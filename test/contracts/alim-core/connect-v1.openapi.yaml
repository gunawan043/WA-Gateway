        schools:
          type: array
          items:
            $ref: '#/components/schemas/SchoolRef'
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    School:
      type: object
      additionalProperties: false
      required:
        [id, work_unit_id, npsn, name, school_level, school_gender, school_status, is_active, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        work_unit_id:
          type: string
          format: uuid
        work_unit:
          $ref: '#/components/schemas/UnitRef'
        npsn:
          type: string
        nss:
          type: [string, 'null']
        name:
          type: string
        school_level:
          type: string
        school_level_text:
          type: [string, 'null']
        school_gender:
          type: string
        school_status:
          type: string
          enum: [negeri, swasta]
        boarding_type:
          type: [string, 'null']
        principal_user_id:
          type: [string, 'null']
          format: uuid
        principal_name:
          type: [string, 'null']
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Position:
      type: object
      additionalProperties: false
      required:
        [id, code, name, kategori, level, hierarchy_level, urutan, description, is_active, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        kategori:
          type: string
        level:
          type: [string, 'null']
        hierarchy_level:
          type: [integer, 'null']
        urutan:
          type: [integer, 'null']
        description:
          type: [string, 'null']
        jenis_gtk:
          anyOf:
            - $ref: '#/components/schemas/JenisGtkRef'
            - type: 'null'
        domain:
          anyOf:
            - $ref: '#/components/schemas/DomainRef'
            - type: 'null'
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PersonUnit:
      type: object
      additionalProperties: false
      required: [assignment_id, unit, position_id, position_name, jabatan, is_primary]
      properties:
        assignment_id:
          type: string
          format: uuid
        unit:
          $ref: '#/components/schemas/UnitRef'
        position_id:
          type: [string, 'null']
          format: uuid
        position_name:
          type: [string, 'null']
        jabatan:
          type: [string, 'null']
        is_primary:
