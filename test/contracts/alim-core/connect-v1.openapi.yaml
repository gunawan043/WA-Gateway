        email:
          type: [string, 'null']
        is_active:
          type: boolean
        status_kepegawaian:
          type: [string, 'null']
        status_kepegawaian_text:
          type: [string, 'null']
        jenis_gtk:
          anyOf:
            - $ref: '#/components/schemas/JenisGtkRef'
            - type: 'null'
        primary_unit:
          anyOf:
            - $ref: '#/components/schemas/UnitRef'
            - type: 'null'
        units:
