              $ref: '#/components/headers/X-Alim-Api-Version'
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/StructuralAssignment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /organization/additional-tasks:
    get:
      operationId: listAdditionalTasks
      summary: Tugas tambahan dari dua sumber
      description: |
        `gtk_additional_tasks` dan `other_teacher_tasks` dibedakan oleh `source`. Identitas
        komposit `(source, id)` wajib; `id` saja tidak unik.
      tags: [Organization]
      x-contract-status: provisional
      x-needs-core-confirmation:
        - K8 jaminan bahwa `(source, id)` unik dan stabil.
        - K7 `unit_id`, `school_id`, `academic_year_id` boleh null pada sumber legacy.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/UpdatedSince'
        - name: user_id
          in: query
          schema:
            type: string
            format: uuid
        - name: work_unit_id
          in: query
          schema:
            type: string
            format: uuid
        - name: school_id
          in: query
          schema:
            type: string
            format: uuid
        - name: academic_year_id
          in: query
          schema:
            type: string
            format: uuid
        - name: source
          in: query
          schema:
            type: string
            enum: [gtk_additional_tasks, other_teacher_tasks, all]
        - name: active_on
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Halaman tugas tambahan.
          headers:
            X-ALIM-API-Version:
              $ref: '#/components/headers/X-Alim-Api-Version'
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/AdditionalTask'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /organization/snapshot:
    get:
      operationId: getOrganizationSnapshot
      summary: Snapshot organisasi
      description: |
        Bootstrap dan rekonsiliasi. `snapshot_at` adalah batas atas `updated_at`; semua baris dengan
        `updated_at <= snapshot_at` disertakan. `checksums` dihitung dari daftar `id` terurut.
      tags: [Sync]
      x-contract-status: provisional
      x-needs-core-confirmation:
        - K1 `snapshot_at` sebagai batas atas dan zona waktunya.
        - K3 batas ukuran; apakah `ndjson` tersedia.
        - Q10 `updated_at` yang tidak bergerak membuat snapshot kehilangan perubahan.
      parameters:
        - name: types
          in: query
          description: Daftar tipe yang diminta, dipisah koma.
          schema:
            type: array
            items:
              $ref: '#/components/schemas/SnapshotType'
        - name: active_only
          in: query
          schema:
            type: boolean
            default: true
        - $ref: '#/components/parameters/IncludeDeleted'
        - name: format
          in: query
          schema:
            type: string
            enum: [json, ndjson]
            default: json
        - name: schema_version
          in: query
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: Snapshot.
          headers:
            X-ALIM-API-Version:
              $ref: '#/components/headers/X-Alim-Api-Version'
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Snapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /organization/changes:
    get:
      operationId: listOrganizationChanges
      summary: Perubahan sejak waktu tertentu
      description: |
        **Belum dapat diimplementasikan secara andal**: Core belum memiliki change ledger dan
        sebagian entitas tidak memiliki soft delete. Draf ini memaku amplop dan bentuk item agar
        Connect dapat menyiapkan konsumennya, bukan menjanjikan endpoint tersedia.
      tags: [Sync]
      x-contract-status: provisional
      x-availability: blocked-on-core-change-ledger
      x-needs-core-confirmation:
        - K4 urutan deterministik `(occurred_at, id, source)`.
        - K5 jaminan tombstone untuk setiap tipe entitas.
        - K6 sifat at-least-once dan jaminan idempotensi.
        - Apakah endpoint ini akan ada sebelum change ledger Core selesai.
      parameters:
        - name: since
          in: query
          required: true
          description: Wajib. Tanpa `since`, Core mengembalikan 422 dan klien harus memakai snapshot.
          schema:
            type: string
            format: date-time
        - name: cursor
          in: query
          description: Opaque; klien tidak boleh mem-parse.
          schema:
            type: string
        - name: types
          in: query
          schema:
            type: array
            items:
              $ref: '#/components/schemas/SnapshotType'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 200
      responses:
        '200':
          description: Halaman perubahan.
          headers:
            X-ALIM-API-Version:
              $ref: '#/components/headers/X-Alim-Api-Version'
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Change'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  securitySchemes:
    connectKey:
      type: apiKey
      in: header
      name: X-ALIM-CONNECT-KEY
      description: |
        Kunci integrasi khusus Connect, terpisah dari POS dan Recruitment (K9, D14). Alternatif
        `Authorization: Bearer <key>` belum disepakati dan tidak dipakai mock.
  headers:
    X-Alim-Api-Version:
      description: Versi kontrak yang melayani request.
      schema:
        type: string
    X-Request-Id:
      description: ID request untuk korelasi log.
      schema:
        type: string
        format: uuid
    Cache-Control:
      description: Selalu `no-store, private`.
      schema:
        type: string
        const: no-store, private
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    IsActive:
      name: is_active
      in: query
      description: Status aktif; `all` menonaktifkan filter.
      schema:
        type: string
        enum: ['true', 'false', 'all']
        default: 'true'
    UpdatedSince:
      name: updated_since
      in: query
      description: Perubahan sejak waktu tertentu (inklusif).
      schema:
        type: string
        format: date-time
    Include:
      name: include
      in: query
      description: Relasi tambahan, dipisah koma.
      schema:
        type: string
    IncludeDeleted:
      name: include_deleted
      in: query
      description: Hanya berlaku pada snapshot dan changes; list biasa menolaknya.
      schema:
        type: boolean
        default: false
  responses:
    Unauthorized:
      description: Kunci integrasi tidak ada atau salah.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: IP tidak diizinkan, atau koneksi bukan HTTPS.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Entitas tidak ditemukan.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UnprocessableEntity:
      description: Query tidak valid.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    TooManyRequests:
      description: Batas trafik terlampaui.
      headers:
        Retry-After:
          description: Detik sampai permintaan berikutnya diterima.
          schema:
            type: integer
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ServiceUnavailable:
      description: Integrasi dinonaktifkan atau kunci belum dikonfigurasi.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    UnitType:
      type: string
      enum:
        - Unsur Pimpinan
        - Unit Akademik
        - Unit Penunjang Akademik
        - Unit Administrasi
        - Unit Pelayanan
        - Unit Humas Publikasi
        - Pelayanan Kesehatan
    SnapshotType:
      type: string
      enum:
        - units
        - schools
        - positions
        - people
        - work_unit_assignments
        - structural_assignments
        - additional_tasks
    SuccessEnvelope:
      type: object
      required: [success, message, data, meta, errors]
      properties:
        success:
          type: boolean
          const: true
        message:
          type: string
        data: {}
        meta:
          $ref: '#/components/schemas/Meta'
        errors:
          type: 'null'
    ErrorEnvelope:
      type: object
      required: [success, message, data, meta, errors]
      properties:
        success:
          type: boolean
          const: false
        message:
          type: string
        data:
          type: 'null'
        meta:
          $ref: '#/components/schemas/Meta'
        errors:
          type: [object, 'null']
          additionalProperties: true
    Meta:
      type: object
      required: [request_id, timestamp, server_time]
      properties:
        request_id:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
        server_time:
          type: string
          format: date-time
        pagination:
          $ref: '#/components/schemas/Pagination'
        next_cursor:
          type: [string, 'null']
        has_more:
          type: boolean
    Pagination:
      type: object
      required: [page, per_page, total, last_page]
      properties:
        page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          minimum: 1
          maximum: 200
        total:
          type: integer
          minimum: 0
        last_page:
          type: integer
          minimum: 0
    UnitRef:
      type: object
      required: [id, code, name]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
    DivisiRef:
      type: object
      required: [id, kode, nama]
      properties:
        id:
          type: string
          format: uuid
        kode:
          type: string
        nama:
          type: string
    DomainRef:
      type: object
      required: [id, code, name]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
    JenisGtkRef:
      type: object
      required: [id, nama]
      properties:
        id:
          type: string
          format: uuid
        nama:
          type: string
    PositionRef:
      type: object
      required: [id, code, name, domain_id]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        domain_id:
          type: [string, 'null']
          format: uuid
    PersonRef:
      type: object
      required: [id, name, is_active]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        is_active:
          type: boolean
    AcademicYearRef:
      type: object
      required: [id, name, semester]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        semester:
          type: string
    DecreeRef:
      type: object
      required: [id, decree_number, decree_type, effective_date, end_date]
      properties:
        id:
          type: string
          format: uuid
        decree_number:
          type: string
        decree_type:
          type: string
        effective_date:
          type: string
          format: date
        end_date:
          type: [string, 'null']
          format: date
    TaskTypeRef:
      type: object
      required: [id, nama]
      properties:
        id:
          type: string
          format: uuid
        nama:
          type: string
    SchoolRef:
      type: object
      required: [id, npsn, name, school_level, school_gender, is_active]
      properties:
        id:
          type: string
          format: uuid
        npsn:
          type: string
        name:
          type: string
        school_level:
          type: string
        school_gender:
          type: string
        is_active:
          type: boolean
    Unit:
      type: object
      additionalProperties: false
      required: [id, code, name, type, parent_id, is_active, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        type:
          $ref: '#/components/schemas/UnitType'
        parent_id:
          type: [string, 'null']
          format: uuid
        parent:
          $ref: '#/components/schemas/UnitRef'
        divisi:
          anyOf:
            - $ref: '#/components/schemas/DivisiRef'
            - type: 'null'
        domain:
          anyOf:
            - $ref: '#/components/schemas/DomainRef'
