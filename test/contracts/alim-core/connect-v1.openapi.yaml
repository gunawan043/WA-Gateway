          enum: [work_unit, structural, additional_task]
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
    Snapshot:
      type: object
      additionalProperties: false
      required: [generated_at, snapshot_at, schema_version, counts, checksums]
      properties:
        generated_at:
          type: string
          format: date-time
        snapshot_at:
          type: string
          format: date-time
        schema_version:
          type: integer
        counts:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
        checksums:
          type: object
          additionalProperties:
            type: string
        units:
          type: array
          items:
            $ref: '#/components/schemas/Unit'
        schools:
          type: array
          items:
            $ref: '#/components/schemas/School'
        positions:
          type: array
          items:
            $ref: '#/components/schemas/Position'
        people:
          type: array
          items:
            $ref: '#/components/schemas/Person'
        work_unit_assignments:
          type: array
          items:
            $ref: '#/components/schemas/WorkUnitAssignment'
        structural_assignments:
          type: array
          items:
            $ref: '#/components/schemas/StructuralAssignment'
        additional_tasks:
          type: array
          items:
            $ref: '#/components/schemas/AdditionalTask'
    Change:
      type: object
      additionalProperties: false
      required: [entity, action, id, source, updated_at, deleted_at, payload]
      properties:
        entity:
          type: string
          enum:
            - unit
            - school
            - position
            - person
            - work_unit_assignment
            - structural_assignment
            - additional_task
        action:
          type: string
          enum: [upsert, delete]
        id:
          type: string
          format: uuid
        source:
          type: [string, 'null']
          enum: [gtk_additional_tasks, other_teacher_tasks, null]
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: [string, 'null']
          format: date-time
        payload:
          type: [object, 'null']
          additionalProperties: true
